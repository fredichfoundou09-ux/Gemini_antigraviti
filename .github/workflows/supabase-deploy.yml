name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "❌ Error: SUPABASE_ACCESS_TOKEN secret is empty or missing in GitHub Repository Secrets"; exit 1; fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "❌ Error: SUPABASE_PROJECT_REF secret is empty or missing in GitHub Repository Secrets"; exit 1; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "❌ Error: SUPABASE_DB_PASSWORD secret is empty or missing in GitHub Repository Secrets"; exit 1; fi
          echo "✅ All 3 Supabase secrets are detected."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check If Token Is API Key Instead Of PAT
        run: |
          if [[ "$SUPABASE_ACCESS_TOKEN" == eyJ* ]]; then
            echo "❌ Le secret SUPABASE_ACCESS_TOKEN commence par 'eyJ...'. Vous avez mis une clé API anon/service_role au lieu d'un Personal Access Token."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Test Supabase Connection With Token
        run: |
          TOKEN=$(echo "$SUPABASE_ACCESS_TOKEN" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          REF=$(echo "$SUPABASE_PROJECT_REF" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          PASS=$(echo "$SUPABASE_DB_PASSWORD" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          echo "Test de connexion Supabase CLI avec SUPABASE_ACCESS_TOKEN..."
          supabase projects list || {
            echo "❌ Échec de la commande 'supabase projects list'."
            echo "👉 Vérifiez que le secret SUPABASE_ACCESS_TOKEN dans GitHub correspond bien à un Personal Access Token valide généré sur https://supabase.com/dashboard/account/tokens."
            exit 1
          }
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link project
        run: |
          TOKEN=$(echo "$SUPABASE_ACCESS_TOKEN" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          REF=$(echo "$SUPABASE_PROJECT_REF" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          PASS=$(echo "$SUPABASE_DB_PASSWORD" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          supabase link --project-ref "$REF" --password "$PASS"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: |
          TOKEN=$(echo "$SUPABASE_ACCESS_TOKEN" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          PASS=$(echo "$SUPABASE_DB_PASSWORD" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          supabase db push --password "$PASS"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: |
          TOKEN=$(echo "$SUPABASE_ACCESS_TOKEN" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          REF=$(echo "$SUPABASE_PROJECT_REF" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          supabase functions deploy create-user --project-ref "$REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
